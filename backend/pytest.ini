[pytest]
# Test discovery patterns
testpaths = .
norecursedirs = archive scripts htmlcov venv env node_modules .git __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=45
    -v

# Coverage configuration
[coverage:run]
source = .
omit =
    tests/*
    test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */migrations/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2

[coverage:html]
directory = htmlcov
